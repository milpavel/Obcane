name: Kontrola a zaloha mistnich informaci
on:
  push:
    paths:
      - 'assets/**'
      - 'index.html'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/refresh-public-info.yml'
  schedule:
    - cron: '47 5,10,15,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-info-snapshot
  cancel-in-progress: false
jobs:
  verify-and-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Install poster OCR
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-ces
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check public API and authorization
        run: python scripts/check_api.py
      - name: Refresh verified waste collection calendar
        run: python scripts/update_waste_calendar.py
      - name: Refresh school, canteen and utility information
        run: node scripts/update_practical_info.mjs
      - name: Read event details from public school posters
        run: python scripts/update_poster_events.py
      - name: Save read-only public snapshot
        run: python scripts/export_snapshot.py
      - name: Commit updated snapshot
        run: |
          git config user.name 'obcane-info-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public-content.json data/poster-events.json data/public-feed.json data/waste-calendar.json data/practical-info.json documents/
          if ! git diff --cached --quiet; then
            git commit -m 'data: update public information snapshot'
            git push
          fi
