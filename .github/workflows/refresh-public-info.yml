name: Aktualizace verejnych informaci
on:
  schedule:
    - cron: "17 5,10,15,20 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-info-import
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/update_public_info.py
      - name: Validate imported data
        run: python scripts/validate_public_info.py
      - name: Commit updated public data
        run: |
          git config user.name "obcane-info-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh local public information"
            git push
      - name: Publish source health in workflow summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,pathlib
          p=pathlib.Path("data/source-health.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("## Kontrola veřejných zdrojů")
              print("Čas:",d.get("checked_at"))
              print("Chyby:",len(d.get("failed",[])))
              for f in d.get("failed",[]): print("- ",f.get("source"),":",f.get("error"))
          PY
