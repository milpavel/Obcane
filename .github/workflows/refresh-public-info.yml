name: Kontrola a zaloha mistnich informaci
on:
  push:
    paths:
      - 'assets/**'
      - 'index.html'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/refresh-public-info.yml'
  schedule:
    - cron: '47 5,10,15,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-info-snapshot
  cancel-in-progress: false
jobs:
  verify-and-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check public API and authorization
        run: python scripts/check_api.py
      - name: Save read-only public snapshot
        run: python scripts/export_snapshot.py
      - name: Commit updated snapshot
        run: |
          git config user.name 'obcane-info-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public-feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update public information snapshot'
            git push
          fi
